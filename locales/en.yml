en:
  theme_metadata:
    description: "Preview uploaded Litematic schematics in a 3D dialog, with a separate download button."
    settings:
      enabled: "Add 3D preview and download controls to .litematic attachments in topics."
      viewer_url: "Full LitematicWebViewer page URL supporting the litematic-preview-v1 protocol. Default: the public viewer service. Only trusted HTTPS viewers should be used; attachment data is passed to this viewer in the visitor's browser."
      max_preview_size_mb: "Maximum compressed attachment size to preview, in MiB. Downloads remain available. The viewer also imposes its own decompressed/model limits."
      load_timeout_seconds: "Maximum seconds to download the attachment and initialize the viewer."
      viewer_theme: "Viewer appearance. Auto follows the visitor's operating system; choose light or dark to match a fixed forum theme."
