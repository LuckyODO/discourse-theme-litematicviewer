    preview: "3D preview"
    download: "Download"
    retry: "Try again"
    frame_title: "3D preview of %{name}"
    download_status: "Downloading schematic…"
    viewer: "Preparing 3D preview…"
    hint: "Drag to rotate · Scroll or pinch to zoom · Esc to close"
    errors:
      unresolved: "This attachment link is not ready yet. Wait a moment, then try again."
      download: "The attachment could not be read. Check that you can download it, then try again."
      too_large: "This file exceeds the %{size} MiB preview limit. You can still download it."
      empty: "This attachment is empty. Download it to check the original file."
      invalid: "This attachment is not a gzip-compressed Litematic file. Download it to check the original file."
      viewer: "This schematic could not be previewed. Try again or download it to open in Litematica."
      timeout: "The preview took too long to load. Try again or download the schematic."
      configuration: "The preview service is not configured correctly. You can still download the schematic."
