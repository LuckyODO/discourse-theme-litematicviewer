<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Protocol test viewer</title>
  <body>
    <p id="result">Waiting for the test file.</p>
    <script>
      const params = new URLSearchParams(location.search);
      const origin = params.get("parentOrigin");
      const channel = params.get("channel");
      const protocol = "litematic-preview-v1";
      const notify = (type, extra = {}) =>
        parent.postMessage({ protocol, channel, type, ...extra }, origin);
      let loads = 0;
      addEventListener("message", (event) => {
        const data = event.data;
        if (
          event.origin !== origin ||
          event.source !== parent ||
          data?.protocol !== protocol ||
          data.channel !== channel
        )
          return;
        if (data.type === "load") {
          loads++;
          document.body.dataset.loads = loads;
          if (!(data.file instanceof Blob))
            throw Error("Expected Blob file transfer");
          document.querySelector("#result").textContent =
            `${data.file.name}: ${data.file.size} bytes`;
          if (params.get("mode") === "error")
            notify("error", { message: "Synthetic parser failure" });
          else notify("loaded", { progress: 1 });
        }
      });
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") notify("close-request");
      });
      if (params.get("mode") !== "silent") notify("ready");
    </script>
  </body>
</html>
